<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Admin - Lottery Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <h1>🛡️ Admin Panel</h1>
                <div class="subtitle">Confirm • Manage • Draw</div>
            </div>
            <div class="header-right">
                <div class="round-box">
                    <div class="round-label">ROUND</div>
                    <div class="round-number" id="roundNumber">#1</div>
                    <div class="round-date" id="roundDate">Loading...</div>
                </div>
                <div class="admin-badge">
                    <span class="dot"></span> Admin
                </div>
            </div>
        </div>

        <!-- NAV TABS -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-page="dashboard">📊 Dashboard</button>
            <button class="nav-tab" data-page="approvals">📋 Approvals</button>
            <button class="nav-tab" data-page="payments">💰 Payments</button>
            <button class="nav-tab" data-page="history">📜 History</button>
        </div>

        <!-- DASHBOARD -->
        <div class="page active" id="page-dashboard">
            <div class="admin-stats">
                <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
                <div class="stat-card"><div class="num" id="statAvailable" style="color:rgba(255,255,255,0.4);">0</div><div class="label">Available</div></div>
                <div class="stat-card"><div class="num" id="statPending" style="color:#ffd93d;">0</div><div class="label">Pending</div></div>
                <div class="stat-card"><div class="num" id="statConfirmed" style="color:#6bcb77;">0</div><div class="label">Confirmed</div></div>
                <div class="stat-card"><div class="num" id="statPaid" style="color:#ffd700;">0</div><div class="label">Paid 💰</div></div>
            </div>

            <div class="admin-actions">
                <button class="btn" onclick="loadData()">🔄 Refresh</button>
                <button class="btn warning" id="drawBtn" onclick="drawWinners()">🎲 Draw Winners</button>
                <button class="btn danger" onclick="resetAll()">🗑️ Reset</button>
            </div>

            <div class="status-text" id="statusText">📊 Loading data...</div>
            <div class="selected-display" id="winnersDisplay" style="display:none;"></div>
        </div>

        <!-- APPROVALS -->
        <div class="page" id="page-approvals">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <h3 style="color:#ffd93d;font-size:0.9rem;">📋 Registrations</h3>
                <span style="color:#8892b0;font-size:0.7rem;" id="pendingCount">0 pending</span>
            </div>
            <div class="approval-list" id="approvalList">
                <div class="no-data">No registrations</div>
            </div>
        </div>

        <!-- PAYMENTS -->
        <div class="page" id="page-payments">
            <h3 style="color:#ffd93d;margin-bottom:10px;font-size:0.9rem;">💰 Payment Requests</h3>
            <div class="approval-list" id="paymentList">
                <div class="no-data">No payment requests</div>
            </div>
        </div>

        <!-- HISTORY -->
        <div class="page" id="page-history">
            <h3 style="color:#6bcb77;margin-bottom:10px;font-size:0.9rem;">📜 Winner History</h3>
            <div class="history-list" id="historyList">
                <div class="no-data">No winners yet</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        const GOOGLE_SHEETS_API = CONFIG.GOOGLE_SHEETS_API;
        const TOTAL_BALLS = CONFIG.TOTAL_BALLS;
        let numbers = [];
        let history = [];
        let isSpinning = false;
        let round = 1;
        let refreshTimer = null;

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            setupNavigation();
            updateDateTime();
            setInterval(updateDateTime, 60000);
            loadData();
            startAutoRefresh();
        });

        function setupNavigation() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    const pageId = this.dataset.page;
                    document.getElementById('page-' + pageId).classList.add('active');
                    if (pageId === 'payments') loadPayments();
                    if (pageId === 'history') loadHistory();
                });
            });
        }

        function startAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(loadData, CONFIG.REFRESH_INTERVAL);
        }

        function updateDateTime() {
            document.getElementById('roundDate').textContent = new Date().toLocaleString();
        }

        // ============================================
        // LOAD DATA
        // ============================================
        async function loadData() {
            try {
                document.getElementById('statusText').textContent = '🔄 Loading...';
                const response = await fetch(GOOGLE_SHEETS_API + '?action=numbers');
                const result = await response.json();

                if (result.success && result.data) {
                    numbers = [];
                    for (let i = 1; i <= TOTAL_BALLS; i++) {
                        const existing = result.data.find(n => n.Number == i);
                        numbers.push({
                            number: i,
                            name: existing ? existing.Name : '',
                            phone: existing ? existing.Phone : '',
                            status: existing ? existing.Status : 'available',
                            payment: existing ? existing.Payment : '',
                            transactionId: existing ? existing['Transaction ID'] : '',
                            screenshot: existing ? existing.Screenshot : ''
                        });
                    }
                    
                    updateStats();
                    renderApprovals();
                    document.getElementById('statusText').textContent = `✅ Loaded ${numbers.filter(n => n.status !== 'available').length} registrations`;
                    await loadHistory();
                } else {
                    numbers = [];
                    for (let i = 1; i <= TOTAL_BALLS; i++) {
                        numbers.push({ number: i, name: '', phone: '', status: 'available', payment: '', transactionId: '', screenshot: '' });
                    }
                    renderApprovals();
                    updateStats();
                }
            } catch(error) {
                console.error('Error:', error);
                document.getElementById('statusText').textContent = '❌ Error connecting.';
            }
        }

        function updateStats() {
            const total = numbers.length;
            const available = numbers.filter(n => n.status === 'available').length;
            const pending = numbers.filter(n => n.status === 'pending').length;
            const confirmed = numbers.filter(n => n.status === 'confirmed').length;
            const paid = numbers.filter(n => n.status === 'paid').length;
            
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statAvailable').textContent = available;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statConfirmed').textContent = confirmed;
            document.getElementById('statPaid').textContent = paid;
            document.getElementById('pendingCount').textContent = pending + ' pending';
            
            // Enable draw if at least 3 confirmed/paid
            const eligible = confirmed + paid;
            document.getElementById('drawBtn').disabled = eligible < 3;
        }

        // ============================================
        // RENDER APPROVALS
        // ============================================
        function renderApprovals() {
            const list = document.getElementById('approvalList');
            const registrations = numbers.filter(n => n.status === 'pending' || n.status === 'confirmed');
            
            if (registrations.length === 0) {
                list.innerHTML = '<div class="no-data">No registrations yet</div>';
                return;
            }

            list.innerHTML = '';
            registrations.forEach((n) => {
                const div = document.createElement('div');
                div.className = `approval-item`;
                
                const statusLabels = {
                    pending: '⏳ Pending',
                    confirmed: '✅ Confirmed',
                    paid: '💰 Paid'
                };
                
                div.innerHTML = `
                    <div class="info">
                        <div class="number">🎯 Number ${n.number}</div>
                        <div class="name">👤 ${n.name || 'Unknown'}</div>
                        <div class="phone">📱 ${n.phone || 'No phone'}</div>
                        <div class="phone">💳 ${n.payment || 'No payment'}</div>
                        ${n.transactionId ? `<div class="phone">🔑 ${n.transactionId}</div>` : ''}
                    </div>
                    <div>
                        <span class="status-badge ${n.status}">${statusLabels[n.status]}</span>
                    </div>
                    <div class="actions">
                        ${n.status === 'pending' ? `<button class="confirm" onclick="updateStatus(${n.number}, 'confirmed')">✅ Confirm</button>` : ''}
                        ${n.status === 'confirmed' ? `<button class="confirm" onclick="updateStatus(${n.number}, 'paid')">💰 Mark Paid</button>` : ''}
                        ${n.status !== 'paid' ? `<button class="reject" onclick="updateStatus(${n.number}, 'available')">✖ Cancel</button>` : ''}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // ============================================
        // UPDATE STATUS
        // ============================================
        async function updateStatus(number, newStatus) {
            try {
                const n = numbers.find(n => n.number === number);
                if (!n) return;

                const oldStatus = n.status;
                n.status = newStatus;
                if (newStatus === 'available') {
                    n.name = '';
                    n.phone = '';
                    n.payment = '';
                    n.transactionId = '';
                }

                updateStats();
                renderApprovals();
                document.getElementById('statusText').textContent = `✅ Number ${number}: ${oldStatus} → ${newStatus}`;

                await fetch(GOOGLE_SHEETS_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'approve_payment',
                        number: number,
                        status: newStatus
                    })
                });

                setTimeout(loadData, 1000);

            } catch(error) {
                console.error('Update error:', error);
                document.getElementById('statusText').textContent = '❌ Failed to update status';
            }
        }

        // ============================================
        // LOAD PAYMENTS
        // ============================================
        async function loadPayments() {
            try {
                const response = await fetch(GOOGLE_SHEETS_API + '?action=payments');
                const result = await response.json();
                if (result.success && result.data) {
                    renderPayments(result.data);
                }
            } catch(e) { console.log('Payments load:', e); }
        }

        function renderPayments(payments) {
            const list = document.getElementById('paymentList');
            list.innerHTML = '';
            const pending = payments.filter(p => p.Status === 'Pending' || p.Status === '');
            
            if (pending.length === 0) {
                list.innerHTML = '<div class="no-data">✅ No pending payments</div>';
                return;
            }
            
            pending.forEach(p => {
                const div = document.createElement('div');
                div.className = 'approval-item';
                div.innerHTML = `
                    <div class="info">
                        <div class="number">🎯 Number ${p.Number}</div>
                        <div class="name">👤 ${p.Name || 'Unknown'}</div>
                        <div class="phone">📱 ${p.Phone || '-'}</div>
                        <div class="phone">🔑 ${p['Transaction ID'] || '-'}</div>
                        <div class="phone">💳 ${p.Method || '-'}</div>
                        ${p.Screenshot ? `<div class="phone">📸 <a href="#" onclick="viewScreenshot('${p.Screenshot}')" style="color:#4d96ff;text-decoration:underline;">View Screenshot</a></div>` : ''}
                    </div>
                    <div class="actions">
                        <button class="confirm" onclick="approvePayment(${p.Number}, 'approved')">✅ Approve</button>
                        <button class="reject" onclick="approvePayment(${p.Number}, 'rejected')">❌ Reject</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function approvePayment(number, status) {
            try {
                const response = await fetch(GOOGLE_SHEETS_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'approve_payment',
                        number: number,
                        status: status
                    })
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('statusText').textContent = `✅ Payment ${status} for number ${number}`;
                    loadPayments();
                    loadData();
                }
            } catch(e) { console.log('Approve error:', e); }
        }

        function viewScreenshot(base64Data) {
            if (base64Data) {
                const win = window.open();
                win.document.write(`<img src="data:image/png;base64,${base64Data}" style="max-width:100%;">`);
            }
        }

        // ============================================
        // DRAW WINNERS
        // ============================================
        async function drawWinners() {
            const eligible = numbers.filter(n => n.status === 'confirmed' || n.status === 'paid');
            
            if (eligible.length < 3) {
                alert(`Need at least 3 confirmed/paid participants. Currently: ${eligible.length}`);
                return;
            }

            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('drawBtn').disabled = true;

            const display = document.getElementById('winnersDisplay');
            display.style.display = 'block';
            display.innerHTML = `<div style="width:100%;color:#ffd93d;font-size:1rem;text-align:center;">🔄 Drawing winners...</div>`;

            // Shuffle and pick 3 winners
            const shuffled = [...eligible].sort(() => Math.random() - 0.5);
            const winners = shuffled.slice(0, 3);

            display.innerHTML = `
                <div style="width:100%;color:#ffd700;font-size:1.1rem;text-align:center;margin-bottom:10px;">🏆 ROUND ${round} WINNERS</div>
                ${winners.map((w, i) => `
                    <div class="winner-card ${i === 0 ? 'first-place' : ''}" style="border-color:${i === 0 ? '#ffd700' : 'rgba(107,203,119,0.1)'};">
                        <div class="rank">${['🥇','🥈','🥉'][i]}</div>
                        <div class="label">${['1st','2nd','3rd'][i]}</div>
                        <div class="ball-small" style="background:#6bcb77;border-color:#6bcb77;">
                            <span class="wnum">${w.name}</span>
                            <span class="wphone">📱 ${w.phone}</span>
                            <span class="wphone">🎯 #${w.number}</span>
                        </div>
                    </div>
                `).join('')}
            `;

            // Save to history
            await fetch(GOOGLE_SHEETS_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'save_winners',
                    winners: winners.map(w => ({ name: w.name, phone: w.phone, number: w.number })),
                    round: round
                })
            });

            round++;
            document.getElementById('roundNumber').textContent = '#' + round;
            document.getElementById('statusText').textContent = '🎉 WINNERS ANNOUNCED!';
            isSpinning = false;
            document.getElementById('drawBtn').disabled = false;
            
            createConfetti();
            await loadHistory();
        }

        // ============================================
        // HISTORY
        // ============================================
        async function loadHistory() {
            try {
                const response = await fetch(GOOGLE_SHEETS_API + '?action=history');
                const result = await response.json();
                if (result.success && result.data) {
                    history = result.data;
                    renderHistory();
                }
            } catch(e) { console.log('History load:', e); }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if (!history || history.length === 0) {
                list.innerHTML = '<div class="no-data">No winners yet</div>';
                return;
            }
            history.slice(0, 20).forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <span class="h-round">Round #${item.Round}</span>
                    <span class="h-winners">${item.winners ? item.winners.map(w => `🏆 ${w.Name}`).join(' | ') : item.Name}</span>
                    <span class="h-time">${item.Date || ''}</span>
                `;
                list.appendChild(div);
            });
        }

        // ============================================
        // CONFETTI
        // ============================================
        function createConfetti() {
            const colors = ['#6bcb77', '#ffd93d', '#4d96ff', '#ff6b6b', '#ffd700'];
            for (let i = 0; i < 40; i++) {
                const c = document.createElement('div');
                c.style.cssText = `
                    position: fixed;
                    width: ${Math.random() * 6 + 3}px;
                    height: ${Math.random() * 6 + 3}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    left: ${Math.random() * 100}%;
                    top: -10px;
                    opacity: 0;
                    pointer-events: none;
                    z-index: 9999;
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    animation: confettiFall ${Math.random() * 2 + 2}s linear forwards;
                    animation-delay: ${Math.random() * 0.5}s;
                `;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 4000);
            }
        }

        // ============================================
        // RESET ALL
        // ============================================
        function resetAll() {
            if (confirm('⚠️ Reset all data? This cannot be undone!')) {
                numbers = [];
                for (let i = 1; i <= TOTAL_BALLS; i++) {
                    numbers.push({ number: i, name: '', phone: '', status: 'available', payment: '', transactionId: '', screenshot: '' });
                }
                round = 1;
                document.getElementById('roundNumber').textContent = '#1';
                updateStats();
                renderApprovals();
                document.getElementById('winnersDisplay').style.display = 'none';
                document.getElementById('statusText').textContent = '🗑️ All data cleared!';
                
                fetch(GOOGLE_SHEETS_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'reset_all' })
                });
            }
        }

        // ============================================
        // EXPOSE GLOBALLY
        // ============================================
        window.loadData = loadData;
        window.updateStatus = updateStatus;
        window.drawWinners = drawWinners;
        window.resetAll = resetAll;
        window.approvePayment = approvePayment;
        window.viewScreenshot = viewScreenshot;
    </script>
</body>
</html>
